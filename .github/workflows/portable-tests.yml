name: Portable tests (quick)

# Ne fait tourner QUE les tests portables (aucune dépendance Windows/GPU) :
# test_wardenbot.py / test_tariq.py / test_config_manager.py. Vérifié
# manuellement (venv isolé, uniquement pyyaml+numpy installés) que les 3
# passent bien dans ces conditions -- le reste (test_dpi_awareness.py,
# test_environment_detect.py, test_region_selector.py, test_calibration_engine.py)
# a besoin de ctypes.windll (Windows uniquement), d'un vrai modèle YOLO
# (torch/ultralytics, lourd) et/ou d'un affichage tkinter réel -- volontairement
# PAS dans ce workflow, restent des tests locaux manuels.

on:
  push:
  pull_request:

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install minimal dependencies (pure-logic tests only)
        run: python -m pip install --upgrade pip pyyaml numpy

      - name: Run test_wardenbot.py
        run: python test_wardenbot.py

      - name: Run test_tariq.py
        run: python test_tariq.py

      - name: Run test_config_manager.py
        run: python test_config_manager.py
