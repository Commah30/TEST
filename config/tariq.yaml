# =============================================================================
# tariq.yaml — rotation Tariq "Spam V2" (importée depuis Schism V2.yaml,
# fournie par l'utilisateur). Copie DANS le projet pour que l'exe puisse l'embarquer
# à côté de config/warden.yaml -- l'original externe n'a pas été touché.
# EN: tariq.yaml — Tariq "Spam V2" rotation (imported from Schism V2.yaml,
# EN: provided by the user). Copied INTO the project so the exe can bundle it
# EN: next to config/warden.yaml -- the external original was not touched.
#
# `post_tick_hook: tariq_post_tick` ci-dessous est un champ hérité du YAML
# d'origine -- il n'est PAS lu automatiquement par engine.py. Le câblage réel
# de tariq_pre_tick/tariq_post_tick se fait explicitement dans main.py
# (dict CHARACTERS), exactement comme pour meiko_pre_tick/meiko_post_tick.
# EN: `post_tick_hook: tariq_post_tick` below is a field inherited from the
# EN: original YAML -- it is NOT read automatically by engine.py. The real
# EN: wiring of tariq_pre_tick/tariq_post_tick is done explicitly in main.py
# EN: (CHARACTERS dict), exactly like for meiko_pre_tick/meiko_post_tick.
#
# DEUX CONDITIONS MODIFIÉES PAR RAPPORT À L'ORIGINAL (fix du bug de
# double-cast documenté dans message.txt -- cf. wardenbot/hooks.py) :
#   - hammer_storm_proc : buff:hammer_storm_empowered -> flag:hammer_storm_proc_ready
#     (+ "not last:hammer_storm_proc" retiré, devenu inutile : le flag est
#     déjà un front montant à usage unique, cf. tariq_pre_tick/post_tick)
#   - skull_crusher_proc : buff:skull_crusher_empowered -> flag:skull_crusher_proc_ready
#     (même forme que hammer_storm_proc, fix appliqué par analogie -- PAS
#     encore confirmé par des logs en jeu comme hammer_storm_proc, à
#     surveiller)
# EN: TWO CONDITIONS CHANGED FROM THE ORIGINAL (fix for the double-cast bug
# EN: documented in message.txt -- cf. wardenbot/hooks.py):
# EN:   - hammer_storm_proc: buff:hammer_storm_empowered -> flag:hammer_storm_proc_ready
# EN:     (+ "not last:hammer_storm_proc" removed, now useless: the flag is
# EN:     already a single-use rising edge, cf. tariq_pre_tick/post_tick)
# EN:   - skull_crusher_proc: buff:skull_crusher_empowered -> flag:skull_crusher_proc_ready
# EN:     (same shape as hammer_storm_proc, fix applied by analogy -- NOT yet
# EN:     confirmed by in-game logs like hammer_storm_proc, to watch)
#
# Le champ `gcd_ms` par-ability de l'original (culling_strike, thunder_call,
# focused_wrath, etc.) est conservé tel quel -- accepté par Ability
# (wardenbot/engine.py) mais PAS ENCORE câblé dans le moteur, sémantique à
# clarifier avant d'y toucher (cf. discussion sur le bug historique "spam
# Wind Kick" côté Meiko, CLAUDE.md bug #1).
# EN: The per-ability `gcd_ms` field from the original (culling_strike,
# EN: thunder_call, focused_wrath, etc.) is kept as-is -- accepted by Ability
# EN: (wardenbot/engine.py) but NOT YET wired into the engine, semantics to
# EN: clarify before touching it (cf. discussion of the historical "spam
# EN: Wind Kick" bug on the Meiko side, CLAUDE.md bug #1).
# state.buffs["hammer_storm_empowered"] / ["skull_crusher_empowered"] sont
# désormais alimentés par make_tariq_state_update_fn (main.py), via les
# templates templates/tariq/hammer_storm_buff.png / skull_crusher_buff.png
# sur REGIONS["tariq"]["tariq_buff_bar"] -- calibrés et validés sur un vrai
# clip Game Bar (marge de confiance large des deux côtés, cf. main.py).
# Pas encore reconfirmé EN JEU RÉEL (calibré depuis une vidéo) -- à valider
# avec detect_check.py une fois en jeu avant de faire confiance à 100%.
# EN: state.buffs["hammer_storm_empowered"] / ["skull_crusher_empowered"] are
# EN: now fed by make_tariq_state_update_fn (main.py), via the templates
# EN: templates/tariq/hammer_storm_buff.png / skull_crusher_buff.png on
# EN: REGIONS["tariq"]["tariq_buff_bar"] -- calibrated and validated on a real
# EN: Game Bar clip (wide confidence margin on both sides, cf. main.py). Not
# EN: yet reconfirmed IN A REAL GAME (calibrated from a video) -- to validate
# EN: with detect_check.py once in-game before trusting it 100%.
# =============================================================================

class_name: tariq
build_name: Spam
display_name: "Spam V2"
post_tick_hook: tariq_post_tick

# gcd_ms: 1000 -> 700 (2026-07-19, donné par l'utilisateur -- Haste a changé
# depuis la dernière mesure). Suite à l'analyse de debug.log (session
# 17:44-18:17) montrant un rythme de presse réel de ~0.98/s, collant presque
# exactement à l'ancien 1000ms -- le rythme mesuré suivait donc fidèlement
# CE réglage, pas un vrai plafond de jeu : la config était simplement
# devenue périmée. À revalider avec une nouvelle mesure (debug.log,
# rythme de presse réel) si le ressenti "trop lent" persiste.
# EN: gcd_ms: 1000 -> 700 (2026-07-19, given by the user -- Haste changed
# EN: since the last measurement). Following the debug.log analysis (session
# EN: 17:44-18:17) showing a real press rate of ~0.98/s, almost exactly
# EN: matching the old 1000ms -- the measured cadence was faithfully
# EN: following THIS setting, not a real in-game ceiling: the config had
# EN: simply gone stale. Revalidate with a fresh measurement (debug.log,
# EN: real press rate) if the "too slow" feeling persists.
gcd_ms: 700

abilities:
  # BUG TROUVÉ EN JEU (2026-07-12), corrigé : cooldown_ms:500 était inventé.
  # Vraie mécanique confirmée par l'utilisateur à l'époque : cooldown réel de 4.44s
  # ET disponible seulement quand la cible passe sous 35% PV (icône grisée
  # au-dessus, allumée en dessous). Template culling_strike.png capturé sur
  # l'état GRISÉ (indisponible) -- même schéma que chain_lightning plus bas :
  # skip_detection:true bypass le check normal, et on caste sur L'ABSENCE du
  # grisé (not debuff:culling_strike_dim) plutôt que la présence d'un
  # template allumé qu'on n'a pas. cf. make_tariq_state_update_fn (main.py).
  # EN: BUG FOUND IN-GAME (2026-07-12), fixed: cooldown_ms:500 was made up.
  # EN: Real mechanic confirmed by the user at the time: real 4.44s cooldown AND
  # EN: available only when the target drops below 35% HP (icon grayed above,
  # EN: lit below). Template culling_strike.png captured on the GRAYED
  # EN: (unavailable) state -- same scheme as chain_lightning below:
  # EN: skip_detection:true bypasses the normal check, and we cast on the
  # EN: ABSENCE of the gray (not debuff:culling_strike_dim) rather than the
  # EN: presence of a lit template we don't have. cf. make_tariq_state_update_fn
  # EN: (main.py).
  #
  # RÉVISÉ PUIS ANNULÉ (2026-07-13) : le guide (method.gg) mentionne
  # "Culling Strike : si ≥10 Fury, toute cible" -- mais l'utilisateur a précisé que
  # cette version (utilisable sur n'importe quelle cible) est liée au
  # légendaire "Executioner's Unsanitary Bands", QU'IL NE JOUE PAS. Sans ce
  # légendaire, l'hypothèse d'origine (disponible sous 35% PV cible,
  # confirmée par l'utilisateur à l'époque) reste la meilleure info qu'on a --
  # condition restaurée telle quelle, aucun changement net sur cette
  # ability pour l'instant faute d'une meilleure source pour SON build
  # précis (sans brassards).
  # EN: REVISED THEN REVERTED (2026-07-13): the guide (method.gg) mentions
  # EN: "Culling Strike: if >=10 Fury, any target" -- but the user clarified that
  # EN: this version (usable on any target) is tied to the legendary
  # EN: "Executioner's Unsanitary Bands", WHICH HE DOES NOT PLAY. Without that
  # EN: legendary, the original assumption (available under 35% target HP,
  # EN: confirmed by the user at the time) stays the best info we have --
  # EN: condition restored as-is, no net change on this ability for now for
  # EN: lack of a better source for HIS specific build (no bands).
  - name: culling_strike
    priorities: {st: 0, cleave: 0, aoe: 0}
    off_gcd: true
    skip_detection: true
    cooldown_ms: 4440
    gcd_ms: 1
    condition: not buff:hammer_storm_empowered, not debuff:culling_strike_dim

  # SIMPLIFIÉ (2026-07-12), À LA DEMANDE DE L'UTILISATEUR : plus de déclenchement lié
  # aux stacks Hammer Storm (le jeu n'affiche jamais "2" sur ce badge, cf.
  # wardenbot/hooks.py -- toute la logique de combo/comptage était vouée à
  # l'échec). Focused Wrath part maintenant dès que son cooldown (86s) est
  # terminé, comme thunder_call -- "not buff:focused_wrath_empowered" évite
  # juste de recaster tant que le buff précédent est encore actif. Toujours
  # utile même sans combo particulier : off_gcd, aucun coût, et le rabais de
  # Fury qu'elle offre (cf. hooks.py, HAMMER_STORM_PROC_FURY_THRESHOLD_DISCOUNTED)
  # profite à Hammer Storm/Skull Crusher dès qu'elle est up.
  # EN: SIMPLIFIED (2026-07-12), AT THE USER'S REQUEST: no more triggering tied
  # EN: to Hammer Storm stacks (the game never shows "2" on that badge, cf.
  # EN: wardenbot/hooks.py -- the whole combo/counting logic was doomed to
  # EN: fail). Focused Wrath now fires as soon as its cooldown (86s) is over,
  # EN: like thunder_call -- "not buff:focused_wrath_empowered" just avoids
  # EN: recasting while the previous buff is still active. Still useful even
  # EN: without a particular combo: off_gcd, no cost, and the Fury discount it
  # EN: grants (cf. hooks.py, HAMMER_STORM_PROC_FURY_THRESHOLD_DISCOUNTED)
  # EN: benefits Hammer Storm/Skull Crusher as soon as it is up.
  # not planner:burst_hold (2026-07-13, condition renommée 2026-07-14 --
  # migration CombatState, flag:X -> planner:X) : câblage du Planner (cf.
  # hooks.py, _update_tariq_planner) -- retenue si thunder_call est prêt mais
  # pas encore elle, pour partir avec lui plutôt que 22-27s avant/après
  # (écarts réels mesurés dans debug.log avant ce fix).
  # EN: not planner:burst_hold (2026-07-13, condition renamed 2026-07-14 --
  # EN: CombatState migration, flag:X -> planner:X): Planner wiring (cf.
  # EN: hooks.py, _update_tariq_planner) -- held back if thunder_call is ready
  # EN: but not yet this one, to fire together rather than 22-27s apart (real
  # EN: gaps measured in debug.log before this fix).
  #
  # skip_detection: true (2026-07-13) : BUG TROUVÉ EN JEU -- c'était la seule
  # ability du kit (avec thunder_call) sans skip_detection, alors que
  # heavy_strike/hammer_storm_proc/skull_crusher_proc/culling_strike/
  # chain_lightning/wild_swing ont TOUTES déjà eu ce même fix (le vrai
  # cooldown suffit, la détection visuelle de l'icône est peu fiable et
  # retarde des casts pourtant légitimes). Preuve directe dans debug.log
  # (session 15:19-15:29) : skip_trace de focused_wrath passe de "condition
  # fausse" (Planner en train de retenir, normal) à "template ne matche pas"
  # pendant 22s d'affilée -- le Planner avait pourtant déjà levé burst_hold,
  # le vrai blocage était la détection template, pas la synchro. Cooldown
  # (86s) déjà confirmé par l'utilisateur -- garde-fou suffisant à lui seul.
  # EN: skip_detection: true (2026-07-13): BUG FOUND IN-GAME -- it was the only
  # EN: ability in the kit (with thunder_call) without skip_detection, whereas
  # EN: heavy_strike/hammer_storm_proc/skull_crusher_proc/culling_strike/
  # EN: chain_lightning/wild_swing ALL already got this same fix (the real
  # EN: cooldown is enough, visual icon detection is unreliable and delays
  # EN: otherwise-legitimate casts). Direct proof in debug.log (session
  # EN: 15:19-15:29): focused_wrath's skip_trace goes from "condition false"
  # EN: (Planner holding, normal) to "template does not match" for 22s
  # EN: straight -- the Planner had already released burst_hold, the real block
  # EN: was template detection, not the sync. Cooldown (86s) already confirmed
  # EN: by the user -- a sufficient guardrail on its own.
  - name: focused_wrath
    priorities: {st: 0, cleave: 0, aoe: 0}
    off_gcd: true
    skip_detection: true
    cooldown_ms: 86000
    gcd_ms: 1
    condition: not buff:focused_wrath_empowered, not planner:burst_hold

  # BUG TROUVÉ EN JEU (2026-07-12) : cooldown_ms:1 était inventé -- vrai
  # cooldown confirmé par l'utilisateur = 43s. En jeu réel avec l'ancienne valeur :
  # 707 presses en ~2 minutes (off_gcd + quasiment aucun frein = spam
  # continu à ~30Hz). Root cause identique à culling_strike ci-dessus :
  # off_gcd bypasse le GCD, donc SEUL cooldown_ms protège contre le spam.
  # EN: BUG FOUND IN-GAME (2026-07-12): cooldown_ms:1 was made up -- real
  # EN: cooldown confirmed by the user = 43s. In a real game with the old value:
  # EN: 707 presses in ~2 minutes (off_gcd + almost no brake = continuous spam
  # EN: at ~30Hz). Same root cause as culling_strike above: off_gcd bypasses
  # EN: the GCD, so ONLY cooldown_ms protects against spam.
  # not planner:burst_hold (2026-07-13, condition renommée 2026-07-14 --
  # migration CombatState, flag:X -> planner:X) : symétrique de focused_wrath
  # ci-dessus -- retenue si focused_wrath est prêt mais pas encore elle. cf.
  # hooks.py, _update_tariq_planner, pour la logique complète (fenêtre
  # d'attente + timeout de sécurité).
  # EN: not planner:burst_hold (2026-07-13, condition renamed 2026-07-14 --
  # EN: CombatState migration, flag:X -> planner:X): mirror of focused_wrath
  # EN: above -- held back if focused_wrath is ready but not yet this one. cf.
  # EN: hooks.py, _update_tariq_planner, for the full logic (wait window +
  # EN: safety timeout).
  # skip_detection: true (2026-07-13) : même fix que focused_wrath ci-dessus,
  # par analogie (même structure, même absence de skip_detection jusqu'ici)
  # -- cooldown (43s) déjà confirmé par l'utilisateur, suffisant comme garde-fou.
  # EN: skip_detection: true (2026-07-13): same fix as focused_wrath above, by
  # EN: analogy (same structure, same absence of skip_detection until now) --
  # EN: cooldown (43s) already confirmed by the user, sufficient as a guardrail.
  - name: thunder_call
    priorities: {st: 0, cleave: 0, aoe: 0}
    off_gcd: true
    skip_detection: true
    cooldown_ms: 43000
    gcd_ms: 1
    condition: not planner:burst_hold

  # BUG TROUVÉ EN JEU (2026-07-12), corrigé : "buff:focused_wrath_empowered"
  # rendait Hammer Storm OBLIGATOIREMENT dépendante de la fenêtre Focused
  # Wrath -- or cette fenêtre n'existe que pendant le combo à 2 stacks (cf.
  # tariq_pre_tick, hooks.py), pas en permanence. Résultat en jeu réel :
  # focused_wrath castée 67 fois contre seulement 7 hammer_storm_proc --
  # le proc s'armait bien plus souvent qu'il n'était consommé, gâchant des
  # procs de la source de dégâts principale (règle "aucun proc ne doit
  # rater" établie plus tôt). Condition retirée : Hammer Storm part dès que
  # prête + fury suffisante, QUE Focused Wrath soit up ou non. Le combo à 2
  # stacks (via tariq_pre_tick) profite quand même du bonus quand la
  # fenêtre s'aligne -- mais ne bloque plus les cas normaux à 1 stack.
  # EN: BUG FOUND IN-GAME (2026-07-12), fixed: "buff:focused_wrath_empowered"
  # EN: made Hammer Storm MANDATORILY dependent on the Focused Wrath window --
  # EN: but that window only exists during the 2-stack combo (cf.
  # EN: tariq_pre_tick, hooks.py), not permanently. Result in a real game:
  # EN: focused_wrath cast 67 times vs only 7 hammer_storm_proc -- the proc
  # EN: armed far more often than it was consumed, wasting procs of the main
  # EN: damage source (the "no proc must be missed" rule established earlier).
  # EN: Condition removed: Hammer Storm fires as soon as ready + enough fury,
  # EN: WHETHER Focused Wrath is up or not. The 2-stack combo (via
  # EN: tariq_pre_tick) still benefits from the bonus when the window aligns --
  # EN: but no longer blocks the normal 1-stack cases.
  # skip_detection ajouté (2026-07-12) : elle dépendait EN PLUS d'un match
  # de template sur l'icône de la barre d'abilities -- redondant et risqué
  # vu qu'on a déjà une détection fiable et dédiée du proc via le buff
  # (front montant sur hammer_storm_empowered, cf. tariq_pre_tick) : seulement
  # 14 hammer_storm_proc en jeu réel pour la source de dégâts principale,
  # cohérent avec des procs valides ratés par un 2e check redondant. La
  # condition (flag:hammer_storm_proc_ready + fury_above:50) est le vrai
  # garde-fou désormais, pas l'icône.
  # EN: skip_detection added (2026-07-12): it ALSO depended on a template match
  # EN: on the ability-bar icon -- redundant and risky since we already have a
  # EN: reliable, dedicated proc detection via the buff (rising edge on
  # EN: hammer_storm_empowered, cf. tariq_pre_tick): only 14 hammer_storm_proc
  # EN: in a real game for the main damage source, consistent with valid procs
  # EN: missed by a redundant 2nd check. The condition
  # EN: (flag:hammer_storm_proc_ready + fury_above:50) is the real guardrail
  # EN: now, not the icon.
  # BUG TROUVÉ EN JEU (2026-07-13, rapporté par l'utilisateur : "le bot doit presser
  # deux fois pour que le sort parte") : analyse de debug.log (session
  # 01:05-01:18) via le marqueur de confirmation (_hammer_storm_proc_pending,
  # cf. hooks.py) -- sur 65 tentatives, 56 confirmées au 1er coup, 9 échouent
  # (le jeu ne caste pas malgré la presse). 6-7 de ces 9 échecs se
  # regroupent entre 50.4% et 53.2% de Fury LUE -- et à cette MÊME lecture
  # (51.1%, 53.2%), d'autres presses réussissent ailleurs dans le log :
  # ce n'est pas un vrai seuil différent à trouver, c'est du bruit de mesure
  # (latence détection/jeu, tolérance du scan de pixels) autour du seuil de
  # 50 -- qui collait bord à bord sans marge pour l'absorber. Aucun échec
  # observé au-dessus de 53.9%. Seuil remonté à 55 -- marge suffisante pour
  # sortir de la zone de bruit, coût minime (la Fury continue de monter,
  # retarde le cast d'une fraction de GCD tout au plus dans le pire cas).
  # EN: BUG FOUND IN-GAME (2026-07-13, reported by the user: "the bot has to
  # EN: press twice for the spell to fire"): analysis of debug.log (session
  # EN: 01:05-01:18) via the confirmation marker (_hammer_storm_proc_pending,
  # EN: cf. hooks.py) -- out of 65 attempts, 56 confirmed on the 1st try, 9
  # EN: fail (the game doesn't cast despite the press). 6-7 of those 9 failures
  # EN: cluster between 50.4% and 53.2% of READ Fury -- and at that SAME
  # EN: reading (51.1%, 53.2%), other presses succeed elsewhere in the log:
  # EN: it's not a real different threshold to find, it's measurement noise
  # EN: (detection/game latency, pixel-scan tolerance) around the threshold of
  # EN: 50 -- which sat edge-to-edge with no margin to absorb it. No failure
  # EN: observed above 53.9%. Threshold raised to 55 -- enough margin to leave
  # EN: the noise zone, minimal cost (Fury keeps rising, delays the cast by a
  # EN: fraction of a GCD at most in the worst case).
  - name: hammer_storm_proc
    # priority_st/cleave/aoe descendus de 2 à 4 (2026-07-15, demandé par
    # l'utilisateur) : même principe déjà appliqué à skull_crusher_proc plus bas
    # (descendue de 3 à 4 le 2026-07-12) -- heavy_strike (priorities.st=3) doit
    # gagner sans ambiguïté à chaque fois que son propre cooldown est fini,
    # point clé de la rotation déjà établi. Sans off_gcd, hammer_storm_proc
    # partage le même GCD que heavy_strike : en cas d'égalité de tick, le
    # perdant attend au pire ~1 GCD (~1s, cf. gcd_ms plus haut), le flag
    # hammer_storm_proc_ready ne s'efface jamais tout seul avec le temps
    # (front montant, cf. hooks.py) -- donc aucun proc perdu, juste retardé
    # d'un cran quand les deux tombent pile au même tick.
    # EN: priority_st/cleave/aoe lowered from 2 to 4 (2026-07-15, requested by
    # EN: the user): same principle already applied to skull_crusher_proc below
    # EN: (lowered from 3 to 4 on 2026-07-12) -- heavy_strike (priorities.st=3)
    # EN: must win unambiguously every time its own cooldown is over, an
    # EN: already-established key rotation point. Without off_gcd,
    # EN: hammer_storm_proc shares the same GCD as heavy_strike: on a tick tie,
    # EN: the loser waits at most ~1 GCD (~1s, cf. gcd_ms above), the flag
    # EN: hammer_storm_proc_ready never clears on its own over time (rising
    # EN: edge, cf. hooks.py) -- so no proc lost, just delayed by one step when
    # EN: both land on the exact same tick.
    priorities: {st: 4, cleave: 4, aoe: 4}
    # EN (cooldown_ms:1): requested by the user (2026-07-12) -- the real
    # EN: anti-double-cast guardrail is the rising edge + rearm on stack
    # EN: increase (hooks.py), not this cooldown; a higher cooldown_ms only
    # EN: delays an already-validated legit proc (cf. 14:16:38/14:16:40 in
    # EN: debug.log, 2 real procs 2s apart).
    cooldown_ms: 1   # demandé par l'utilisateur (2026-07-12) -- le vrai garde-fou anti-double-cast est le front montant + réarmement sur augmentation de stacks (hooks.py), pas ce cooldown ; un cooldown_ms plus élevé ne fait que retarder un proc légitime déjà validé (cf. 14:16:38/14:16:40 dans debug.log, 2 procs réels à 2s d'écart)
    is_proc: true
    skip_detection: true
    # EN (template): kept for reference -- no longer used for detection
    # EN: (skip_detection:true), only by REGIONS["tariq"]["hammer_storm_stack_badge"]/state-update.
    template: hammer_storm   # gardé pour référence -- plus utilisé pour la détection (skip_detection:true), seulement par REGIONS["tariq"]["hammer_storm_stack_badge"]/état-update
    condition: fury_above:55, hooks:hammer_storm_proc_ready

  # BUG TROUVÉ EN JEU (2026-07-12) : priority_st était à égalité avec
  # heavy_strike (3 partout) -- au tie-break par ordre de déclaration
  # (engine.py), skull_crusher_proc étant déclarée AVANT heavy_strike dans
  # ce fichier, elle gagnait systématiquement le créneau de scan dès que les
  # deux étaient prêtes en même temps, retardant heavy_strike bien au-delà
  # de la fin de son propre cooldown -- alors que l'utilisateur a explicitement dit
  # que heavy_strike doit partir à CHAQUE fin de cooldown, point clé de la
  # rotation. priority_st descendue à 4 (skull_crusher/face_breaker/
  # chain_lightning/wild_swing décalées d'un cran en conséquence) pour que
  # heavy_strike gagne sans ambiguïté.
  # EN: BUG FOUND IN-GAME (2026-07-12): priority_st was tied with heavy_strike
  # EN: (3 everywhere) -- on the declaration-order tie-break (engine.py),
  # EN: skull_crusher_proc being declared BEFORE heavy_strike in this file, it
  # EN: systematically won the scan slot whenever both were ready at the same
  # EN: time, delaying heavy_strike well past the end of its own cooldown --
  # EN: whereas the user explicitly said heavy_strike must fire at EVERY cooldown
  # EN: end, a key rotation point. priority_st lowered to 4 (skull_crusher/
  # EN: face_breaker/chain_lightning/wild_swing shifted one step accordingly)
  # EN: so heavy_strike wins unambiguously.
  # cooldown_ms remis à 1 par l'utilisateur (2026-07-12) -- le vrai garde-fou
  # anti-double-cast est le front montant (MIN_ABSENT_TICKS, hooks.py), pas
  # ce cooldown ; le fix de priority_st ci-dessus (elle ne vole plus le
  # créneau de scan de heavy_strike) a déjà réglé le symptôme observé
